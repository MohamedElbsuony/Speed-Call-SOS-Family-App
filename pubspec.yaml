name: speed_call_app
description: "Production-Ready One-Tap Direct Dial Widget Application for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^8.1.6
  go_router: ^14.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  get_it: ^7.7.0
  equatable: ^2.0.5
  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9
  dynamic_color: ^1.7.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  vibration: ^2.0.1
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
